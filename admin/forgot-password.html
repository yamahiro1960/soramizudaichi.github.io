<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>パスワードをお忘れの方 | 空と水と大地合同会社</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-login-main">
    <section class="admin-login-card">
      <h1>パスワードをお忘れの方</h1>
      <p>登録済みのメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>

      <div id="forgot-msg" class="msg"></div>

      <form id="forgot-form" class="admin-form" novalidate>
        <div class="form-group">
          <label for="forgot-email">メールアドレス</label>
          <input type="email" id="forgot-email" autocomplete="username" required>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="forgot-submit">再設定メールを送信</button>
      </form>

      <a class="admin-login-back" href="login.html">← ログイン画面に戻る</a>
    </section>
  </main>

  <script src="../data/supabase-config.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const msg = document.getElementById('forgot-msg');
    const submitBtn = document.getElementById('forgot-submit');
    const emailInput = document.getElementById('forgot-email');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = `msg msg--${type} show`;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = emailInput.value.trim();
      if (!email) {
        showMsg('メールアドレスを入力してください。', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      try {
        if (!window.SUPABASE_CONFIG || !window.SUPABASE_CONFIG.enabled) {
          throw new Error('Supabase 設定が読み込まれていません。');
        }
        const config = window.SUPABASE_CONFIG;
        const redirectTo = `${window.location.origin}/admin/reset-password.html`;
        const res = await fetch(`${config.url}/auth/v1/recover?redirect_to=${encodeURIComponent(redirectTo)}`, {
          method: 'POST',
          headers: {
            apikey: config.anonKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });

        // メールアドレスの存在有無を外部に漏らさないため、成否に関わらず同一文言を表示する
        if (!res.ok && res.status !== 400 && res.status !== 422) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error_description || body.msg || body.error || `送信に失敗しました: ${res.status}`);
        }

        form.hidden = true;
        showMsg('入力されたメールアドレスが登録済みであれば、パスワード再設定用のリンクを送信しました。メールをご確認ください。', 'success');
      } catch (err) {
        showMsg('送信に失敗しました: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = '再設定メールを送信';
      }
    });
  </script>
</body>
</html>
