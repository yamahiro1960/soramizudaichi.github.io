<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>パスワード再設定 | 空と水と大地合同会社</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-login-main">
    <section class="admin-login-card">
      <h1>パスワード再設定</h1>
      <p id="intro-msg">新しいパスワードを入力してください。</p>

      <div id="reset-msg" class="msg"></div>

      <form id="reset-form" class="admin-form" novalidate>
        <div class="form-group">
          <label for="new-password">新しいパスワード</label>
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
        </div>

        <div class="form-group">
          <label for="new-password-confirm">新しいパスワード（確認）</label>
          <input type="password" id="new-password-confirm" autocomplete="new-password" minlength="8" required>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="reset-submit">パスワードを更新</button>
      </form>

      <a class="admin-login-back" href="login.html">← ログイン画面に戻る</a>
    </section>
  </main>

  <script src="../data/supabase-config.js"></script>
  <script>
    const introMsg = document.getElementById('intro-msg');
    const form = document.getElementById('reset-form');
    const msg = document.getElementById('reset-msg');
    const submitBtn = document.getElementById('reset-submit');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = `msg msg--${type} show`;
    }

    function parseHashParams() {
      const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
      return new URLSearchParams(hash);
    }

    const hashParams = parseHashParams();
    const accessToken = hashParams.get('access_token');
    const hashType = hashParams.get('type');
    const hashError = hashParams.get('error_description') || hashParams.get('error');

    const validLink = !!accessToken && (hashType === 'recovery' || hashType === 'invite' || hashType === 'magiclink');

    if (!validLink) {
      form.hidden = true;
      introMsg.textContent = 'このリンクは無効か、有効期限が切れています。';
      showMsg(hashError ? `エラー: ${hashError}` : '管理画面のログイン画面からパスワードリセットをやり直してください。', 'error');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const pw1 = document.getElementById('new-password').value;
      const pw2 = document.getElementById('new-password-confirm').value;

      if (pw1.length < 8) {
        showMsg('パスワードは8文字以上で入力してください。', 'error');
        return;
      }
      if (pw1 !== pw2) {
        showMsg('確認用パスワードが一致しません。', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '更新中...';

      try {
        if (!window.SUPABASE_CONFIG || !window.SUPABASE_CONFIG.enabled) {
          throw new Error('Supabase 設定が読み込まれていません。');
        }
        const config = window.SUPABASE_CONFIG;
        const res = await fetch(`${config.url}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            apikey: config.anonKey,
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password: pw1 })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body.error_description || body.msg || body.error || `更新に失敗しました: ${res.status}`);
        }

        form.hidden = true;
        showMsg('パスワードを更新しました。ログイン画面から新しいパスワードでログインしてください。', 'success');
        setTimeout(() => { window.location.replace('login.html'); }, 2500);
      } catch (err) {
        showMsg('パスワード更新に失敗しました: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'パスワードを更新';
      }
    });
  </script>
</body>
</html>
